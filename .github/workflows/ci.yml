name: Licitaciones Odoo 19
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/check_static.py
      - run: python -m unittest discover -s tests/standalone -v
  odoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OCA/reporting-engine
          ref: '19.0'
          path: .ci/reporting-engine
      - name: Build test runtime
        run: docker build -t licitaciones-ci -f scripts/Dockerfile.ci .
      - name: Start isolated PostgreSQL
        run: |
          docker network create licitaciones-ci
          docker run -d --name lp-postgres --network licitaciones-ci \
            -e POSTGRES_USER=odoo -e POSTGRES_PASSWORD=odoo_ci_only \
            --health-cmd='pg_isready -U odoo' --health-interval=2s --health-retries=30 postgres:16
          for attempt in $(seq 1 30); do
            if docker exec lp-postgres pg_isready -U odoo; then break; fi
            sleep 2
          done
      - name: Install, test ORM and reports, check coverage
        run: |
          mkdir -p test-results
          chmod 777 test-results
          docker run --rm --network licitaciones-ci --entrypoint /bin/bash \
            -v "$PWD:/mnt/extra-addons/licitaciones_publicas:ro" \
            -v "$PWD/.ci/reporting-engine:/mnt/oca:ro" \
            -v "$PWD/test-results:/results" \
            -e COVERAGE_FILE=/results/.coverage licitaciones-ci -c '
              set -e
              python3 -m coverage run --rcfile=/mnt/extra-addons/licitaciones_publicas/.coveragerc \
                --source=/mnt/extra-addons/licitaciones_publicas /usr/bin/odoo \
                --db_host=lp-postgres --db_user=odoo --db_password=odoo_ci_only \
                -d licitaciones_ci --addons-path=/mnt/extra-addons,/mnt/oca,/usr/lib/python3/dist-packages/odoo/addons \
                -i licitaciones_publicas --test-enable --test-tags=/licitaciones_publicas \
                --load-language=es_MX --without-demo=all --stop-after-init --max-cron-threads=0 \
                --logfile=/results/odoo.log
              python3 -m coverage xml --rcfile=/mnt/extra-addons/licitaciones_publicas/.coveragerc -o /results/coverage.xml
              python3 -m coverage report --rcfile=/mnt/extra-addons/licitaciones_publicas/.coveragerc
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo-test-results
          path: test-results/
          include-hidden-files: true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f lp-postgres || true
          docker network rm licitaciones-ci || true
